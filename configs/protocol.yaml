# Paths are relative to the repository, not to your terminal's working directory.
protocol: firesmoke-v1
datasets:
  dfire:
    root: data/raw/D-Fire
    layout: dfire
    source_names: [smoke, fire]
    invalid_box_policy: exclude_invalid_images
  fasdd:
    root: data/raw/FASDD_CV
    layout: fasdd
    source_names: [fire, smoke]
    invalid_box_policy: exclude_invalid_images
  # Hard-negative 加强版(G2 实验组): train 划分内的纯背景图在 manifest 中重复 3 次。
  # 目的: 提高背景梯度权重, 让模型学到「红色/橙色物体(红花、红发、暖色灯带)不是火」。
  # 只在 train 生效 —— val 与 test 保持每张图一次, 否则 background_alarm_fraction
  # 这类按图像求均值的指标会被重复行偏置。
  # 预期: train 从 15,485 行 -> 15,485 + 7,043×2 = 29,571 行(val 1,722 / test 4,294 不变)
  dfire_hn3:
    root: data/raw/D-Fire
    layout: dfire
    source_names: [smoke, fire]
    invalid_box_policy: exclude_invalid_images
    neg_repeat: 3
  # FireSmoke-YOLO: 另一套 fire/smoke 数据（9,452 图 / 7,253 有标签 / 2,199 负样本占 23.3%）。
  # 来源 HuggingFace YingjieCheng/FireSmokeDetDatasets，无官方 README/类别声明。
  # 类别顺序 0=fire, 1=smoke —— 与仓库 NAMES 一致（已画框人工验证 4 张含两类样本），无需换序。
  # 注意: 原数据集的负样本(NoFileSmoke*)原本没有标签文件，已用
  #       analysis/scripts/prepare_yolo_source.py 补为 2,199 个空标签文件（纯新增，未改既有文件）。
  # 该数据集目前只存在于 lxy 机器（data/raw/FireSmoke-YOLO）；本机未放置，
  # 但只要不对 fsyolo 跑 prepare/训练就不受影响。
  fsyolo:
    root: data/raw/FireSmoke-YOLO
    layout: dfire
    source_names: [fire, smoke]
    invalid_box_policy: exclude_invalid_images
prepared_root: data/prepared
results_root: results
weights: weights/yolo11n.pt
seeds: [0, 1, 2]
methods:
  baseline: {architecture: baseline, background_alpha: 0.0, style: false}
  p2: {architecture: p2, background_alpha: 0.0, style: false}
  background: {architecture: baseline, background_alpha: 0.25, style: false}
  p2_background: {architecture: p2, background_alpha: 0.25, style: false}
  full: {architecture: p2, background_alpha: 0.25, style: true}
background_topk: 32
training:
  epochs: 100
  imgsz: 640
  batch: 32
  device: '0'
  workers: 8
  optimizer: SGD
  lr0: 0.01
  lrf: 0.01
  momentum: 0.937
  weight_decay: 0.0005
  warmup_epochs: 3.0
  patience: 100
  deterministic: true
  amp: false
  close_mosaic: 10
  mosaic: 1.0
  mixup: 0.0
  hsv_h: 0.015
  hsv_s: 0.7
  hsv_v: 0.4
  scale: 0.5
  translate: 0.1
  fliplr: 0.5
  cache: false
  plots: true
  save: true
  val: true
