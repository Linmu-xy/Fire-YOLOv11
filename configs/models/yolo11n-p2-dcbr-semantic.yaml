# YOLO11n P2 + DCBR (semantic), Ultralytics 8.4.42.
# Layers 0..22 are identical to upstream YOLO11n for controlled shared transfer.
# Research candidate: exact identity at initialization. See docs/MODULE_DCBR.md.
nc: 2
scale: n
scales:
  n: [0.50, 0.25, 1024]
backbone:
  - [-1, 1, Conv, [64, 3, 2]]
  - [-1, 1, Conv, [128, 3, 2]]
  - [-1, 2, C3k2, [256, False, 0.25]]
  - [-1, 1, Conv, [256, 3, 2]]
  - [-1, 2, C3k2, [512, False, 0.25]]
  - [-1, 1, Conv, [512, 3, 2]]
  - [-1, 2, C3k2, [512, True]]
  - [-1, 1, Conv, [1024, 3, 2]]
  - [-1, 2, C3k2, [1024, True]]
  - [-1, 1, SPPF, [1024, 5]]
  - [-1, 2, C2PSA, [1024]]
head:
  - [-1, 1, nn.Upsample, [null, 2, nearest]]
  - [[-1, 6], 1, Concat, [1]]
  - [-1, 2, C3k2, [512, false]]
  - [-1, 1, nn.Upsample, [null, 2, nearest]]
  - [[-1, 4], 1, Concat, [1]]
  - [-1, 2, C3k2, [256, false]]
  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 13], 1, Concat, [1]]
  - [-1, 2, C3k2, [512, false]]
  - [-1, 1, Conv, [512, 3, 2]]
  - [[-1, 10], 1, Concat, [1]]
  - [-1, 2, C3k2, [1024, true]]
  - [16, 1, nn.Upsample, [null, 2, nearest]] # 23: semantic P3, 64 channels
  - [[-1, 2], 1, Concat, [1]]               # 24: [semantic P3, shallow P2]
  - [-1, 1, DetailConditionedBandResidual, [64, 64, 16, 8, 0.25, semantic]] # 25: identity at initialization
  - [-1, 1, DWConv, [512, 3, 1]]
  - [-1, 1, Conv, [128, 1, 1]]
  - [-1, 1, C3k2, [128, false]]             # 28: gated P2, stride 4
  - [[28, 16, 19, 22], 1, Detect, [nc]]
